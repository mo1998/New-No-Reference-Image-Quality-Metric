include: ../siglip2_l16_384_kadid.yaml
experiment:
  name: siglip2_gated_kadid
model:
  kwargs:
    model_name: google/siglip2-large-patch16-384
    freeze_blocks: 16
    head_hidden: 256
    dropout: 0.2
    aux_heads: false
    head_type: gated
train:
  epochs: 10
  batch_size: 8
  lr: 5.0e-5
  weight_decay: 5.0e-2
  loss:
    mse: 1.0
    plcc: 0.2
    rank: 0.0
    aux_distortion: 0.0
    aux_level: 0.0
eval:
  tta: true
  batch_size: 32
