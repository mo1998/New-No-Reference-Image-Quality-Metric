include: base.yaml
experiment:
  name: mobilenetv3_large_frozen_kadid
data:
  norm: imagenet
model:
  name: mobilenet_v3_large
  pretrained: true
  kwargs:
    freeze: true
    head: mlp
    head_hidden: 256
    dropout: 0.1
train:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  epochs: 30
  early_stop:
    patience: 10
